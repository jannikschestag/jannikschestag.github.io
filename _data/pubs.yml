  preprint-server: null
  preprint-identifier: null
  preprint-url: null
  software-url: null
  topics:
    - FPT
    - Parsimony
  summary_lay: >-
    A common method for reconstructing an evolutionary tree is to start with a candidate tree and repeatedly make small changes that improve how well it explains the observed biological data. This paper shows that for several standard kinds of tree modification, checking all nearby alternatives is essentially unavoidable in the worst case, while a more restricted form of modification permits a substantially faster search.
  summary_lay_german: >-
    Eine verbreitete Methode zur Rekonstruktion eines Evolutionsbaums besteht darin, mit einem möglichen Baum zu beginnen und ihn schrittweise so zu verändern, dass er die beobachteten biologischen Daten besser erklärt. Diese Arbeit zeigt, dass bei mehreren üblichen Arten solcher Veränderungen im schlimmsten Fall im Wesentlichen alle naheliegenden Alternativen geprüft werden müssen. Für eine stärker eingeschränkte Form der Veränderung ist dagegen eine wesentlich schnellere Suche möglich.
  abstract: >
    Maximum Parsimony is the problem of computing a most parsimonious phylogenetic tree for a taxa set \(X\) from character data for \(X\). A common strategy to attack this notoriously hard problem is to perform a local search over the phylogenetic tree space. Here, one is given a phylogenetic tree \(T\) and wants to find a more parsimonious tree in the neighborhood of \(T\). We study the complexity of this problem when the neighborhood contains all trees within distance \(k\) for several classic distance functions. For the nearest neighbor interchange (NNI), subtree prune and regraft (SPR), tree bisection and reconnection (TBR), and edge contraction and refinement (ECR) distances, we show that, under the exponential time hypothesis, there are no algorithms with running time \(|I|^{o(k)}\) where \(|I|\) is the total input size. Hence, brute-force algorithms with running time \(|X|^{\mathcal{O}(k)} \cdot |I|\) are essentially optimal.
    <br />
    In contrast to the above distances, we observe that for the sECR-distance, where the contracted edges are constrained to form a subtree, a better solution within distance \(k\) can be found in \(k^{\mathcal{O}(k)} \cdot |I|^{\mathcal{O}(1)}\) time.
  bibtex: >
    @inproceedings{komusiewicz2023complexity,
      title = {{On the Complexity of Parameterized Local Search for the Maximum Parsimony Problem}},
      author = {Komusiewicz, Christian and Linz, Simone and Morawietz, Nils and Schestag, Jannik},
