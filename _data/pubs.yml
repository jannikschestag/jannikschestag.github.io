  summary_lay: >-
    Two players take turns putting their own weighted items into a shared knapsack, with one player trying to reach a target while the other may either behave greedily or actively try to prevent this. This paper investigates how difficult it is to find a winning strategy under different rules and also considers a semi-cooperative “protective” version in which the first player wants the second player to reach a target as well.
  summary_lay_german: >-
    Zwei Spieler legen abwechselnd ihre jeweils unterschiedlich gewichteten Gegenstände in einen gemeinsamen Rucksack. Dabei versucht ein Spieler, einen bestimmten Zielwert zu erreichen, während der andere entweder eigennützig handelt oder dies aktiv verhindern möchte. Diese Arbeit untersucht, wie schwierig es unter verschiedenen Regeln ist, eine Gewinnstrategie zu finden, und betrachtet außerdem eine halbkooperative Variante, bei der der erste Spieler auch dem zweiten helfen möchte, dessen Ziel zu erreichen.
  abstract: >
    In Subset Sum Game as studied by Pieterse and Woeginger [Theory of Computing Systems, 2021], two players alternatingly fill a common knapsack each with items from a private collection. The goal of Player A is to reach a value of at least \(T_A\), whereas Player B may follow different strategies. Subset Sum Game is NP-complete and solvable in pseudopolynomial time if Player B greedily selects the biggest available item in each turn; the game is PSPACE-complete, however, if Player B plays a hostile strategy where the only aim is to avoid that Player A wins. We continue the study of the game with these two strategies for Player B.
    <br />
    First, we provide a faster pseudopolynomial-time algorithm for a greedy Player B and show that the problem with a hostile Player B is fixed-parameter tractable with respect to the knapsack capacity \(C\). Moreover, we study the influence of further parameters such as \(T_A\), the number of rounds in the game, and the number of different numbers in the input on the complexity of the problem. Second, we consider a further variant of the game, called Protective Subset Sum Game, where Player A additionally has the goal that Player B reaches a value of at least \(T_B\). In a nutshell, we show that most algorithms for the nonprotective variant can be transferred to Protective Subset Sum Game.
  bibtex: >
    @inproceedings{garvardt2024protective,
      title = {{Protective and Nonprotective Subset Sum Games: A Parameterized Complexity Analysis}},
      author = {Garvardt, Jaroslav and Komusiewicz, Christian and Lorke, Ber and Schestag, Jannik},
