- title: Weighted Food Webs Make Computing Phylogenetic Diversity So Much Harder
  published: true
  release-date: 2026-02-02
  first-publication: 2025
  authors:
  - first: Jannik
    last: Schestag
  type: conference
  journal: Proceedings of the 51st International Conference on Current Trends in Theory and Practice of Computer Science (SOFSEM 2026)
  volume: null
